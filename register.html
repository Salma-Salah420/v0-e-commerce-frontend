<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ShopHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fas fa-shopping-bag"></i>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join us and start shopping today</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" 
                 id="fullName" 
                 class="form-control" 
                 placeholder="Enter your full name"
                 required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" 
                 id="email" 
                 class="form-control" 
                 placeholder="Enter your email"
                 required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" 
                 id="password" 
                 class="form-control" 
                 placeholder="Create a password"
                 minlength="6"
                 required>
          <span class="form-text">Password must be at least 6 characters</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" 
                 id="confirmPassword" 
                 class="form-control" 
                 placeholder="Confirm your password"
                 required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="register-btn">
          <i class="fas fa-user-plus"></i>
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Check if already logged in
    if (isLoggedIn()) {
      window.location.href = 'index.html';
    }

    // Handle registration form submission
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('register-btn');

      // Validate passwords match
      if (password !== confirmPassword) {
        showToast('error', 'Validation Error', 'Passwords do not match.');
        return;
      }

      // Validate password length
      if (password.length < 6) {
        showToast('error', 'Validation Error', 'Password must be at least 6 characters.');
        return;
      }

      setButtonLoading(submitBtn, true);

      try {
        await register(fullName, email, password);
        showToast('success', 'Registration Successful', 'Your account has been created. Please login.');
        
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      } catch (error) {
        showToast('error', 'Registration Failed', error.message);
        setButtonLoading(submitBtn, false);
      }
    });
  </script>
</body>
</html>
